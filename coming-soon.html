<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | Vanta Events Virtual Venue Portal</title>
  <meta name="description" content="Vanta Events 2026 Virtual Event Studio & Interactive Venue Planner is coming soon. Sign up for early corporate access.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%237C3AED'/%3E%3Cpath d='M23 27h54L50 76z' fill='none' stroke='%23F4D06F' stroke-width='8' stroke-linejoin='round'/%3E%3Ccircle cx='50' cy='52' r='6' fill='%23F4D06F'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>
  <!-- LOADER -->
  <div class="loader" id="loader">
    <div class="loader-logo"></div>
  </div>

  <!-- AUTH / COMING SOON LAYOUT -->
  <section class="auth-page" style="display:flex">
    <div class="auth-controls">
      <button class="control-btn" id="authRtl" aria-label="Toggle RTL layout">RTL</button>
      <button class="control-btn" id="authTheme" aria-label="Toggle dark mode">☾</button>
    </div>

    <div class="auth-box" style="width:min(520px,100%)">
      <a class="logo auth-logo" href="index.html" aria-label="Vanta Events Home">
        <div class="logo-mark"></div>
        <div class="logo-name">
          Vanta<span>Events</span>
        </div>
      </a>

      <div class="auth-card" style="text-align:center">
        <div class="eyebrow" style="color:var(--gold);margin-bottom:12px">Holiday 2026 Preview</div>
        <h1 style="font-size:32px;margin-bottom:10px">Virtual Venue Studio Launching Soon</h1>
        <p style="margin-bottom:24px">
          Experience 3D immersive ballroom walk-throughs, real-time seating chart simulations,
          and automated catering menu estimators directly from your browser.
        </p>

        <form id="notifyForm" onsubmit="event.preventDefault(); showToast('Thank you! You have been prioritized for early access.'); this.reset();">
          <div class="form-group" style="margin-bottom:15px">
            <input
              type="email"
              required
              placeholder="Enter corporate email for early access"
              style="text-align:center">
          </div>
          <button class="btn btn-primary auth-submit" type="submit">
            Join VIP Waitlist
          </button>
        </form>

        <div style="margin-top:24px">
          <a class="btn btn-outline" href="index.html" style="width:100%">
            Return to Main Website
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- SCRIPT -->
  <script src="assets/js/main.js"></script>
</body>
</html>
