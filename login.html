<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal Login | Vanta Events</title>
  <meta name="description" content="Sign in to your Vanta Events corporate portal to manage event requirements, RSVP tracking, catering, and budget allocations.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%237C3AED'/%3E%3Cpath d='M23 27h54L50 76z' fill='none' stroke='%23F4D06F' stroke-width='8' stroke-linejoin='round'/%3E%3Ccircle cx='50' cy='52' r='6' fill='%23F4D06F'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>
  <!-- LOADER -->
  <div class="loader" id="loader">
    <div class="loader-logo"></div>
  </div>

  <!-- AUTH PAGE -->
  <section class="auth-page" id="login">
    <div class="auth-controls">
      <button class="control-btn" id="authRtl" aria-label="Toggle RTL layout">RTL</button>
      <button class="control-btn" id="authTheme" aria-label="Toggle dark mode">☾</button>
    </div>

    <div class="auth-box">
      <a class="logo auth-logo" href="index.html" aria-label="Vanta Events Home">
        <div class="logo-mark"></div>
        <div class="logo-name">
          Vanta<span>Events</span>
        </div>
      </a>

      <div class="auth-card">
        <h1>Welcome Back</h1>
        <p>Sign in to manage your corporate events.</p>

        <div class="social-row">
          <button class="social-btn" type="button" onclick="showToast('Google sign-in selected')">
            <svg viewBox="0 0 24 24">
              <path fill="#4285F4" d="M21.35 12.23c0-.72-.06-1.42-.18-2.09H12v3.95h5.23a4.47 4.47 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.92-4.2 2.92-7.25z"/>
              <path fill="#34A853" d="M12 21.87c2.63 0 4.84-.87 6.45-2.39l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.7-1.72-5.47-4.03H3.28v2.53A9.74 9.74 0 0 0 12 21.87z"/>
              <path fill="#FBBC05" d="M6.53 13.93a5.86 5.86 0 0 1 0-3.73V7.67H3.28a9.75 9.75 0 0 0 0 8.79l3.25-2.53z"/>
              <path fill="#EA4335" d="M12 6.17c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.27 14.63 2.4 12 2.4a9.74 9.74 0 0 0-8.72 5.27l3.25 2.53C7.3 7.89 9.46 6.17 12 6.17z"/>
            </svg>
            Continue with Google
          </button>
          <button class="social-btn" type="button" onclick="showToast('Apple sign-in selected')">
            <svg viewBox="0 0 24 24">
              <path fill="currentColor" d="M16.77 12.72c.02 2.12 1.87 2.83 1.89 2.84-.02.05-.3 1.04-1 2.05-.6.87-1.23 1.74-2.21 1.76-.96.02-1.27-.56-2.38-.56-1.11 0-1.46.54-2.37.58-.95.04-1.67-.94-2.27-1.81-1.23-1.78-2.17-5.02-.91-7.2.63-1.09 1.75-1.78 2.96-1.8.93-.02 1.81.63 2.38.63.57 0 1.64-.78 2.76-.67.47.02 1.79.19 2.64 1.42-.07.04-1.58.92-1.57 2.76zM14.9 5.35c.5-.61.84-1.46.75-2.31-.73.03-1.61.49-2.13 1.1-.47.54-.87 1.41-.76 2.24.81.06 1.64-.41 2.14-1.03z"/>
            </svg>
            Continue with Apple
          </button>
        </div>

        <div class="divider">OR CONTINUE WITH EMAIL</div>

        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input
              id="loginEmail"
              type="email"
              required
              placeholder="you@company.com">
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input
              id="loginPassword"
              type="password"
              required
              placeholder="Enter your password">
          </div>

          <div class="auth-options">
            <label class="remember">
              <input type="checkbox">
              Remember Me
            </label>
            <button class="forgot" type="button" onclick="showToast('Password reset instructions sent to your email.')">
              Forgot Password?
            </button>
          </div>

          <button class="btn btn-primary auth-submit" type="submit">
            Sign In
          </button>
        </form>

        <div class="auth-switch">
          Don't have an account?
          <a href="signup.html">Create Account</a>
        </div>
      </div>
    </div>
  </section>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- SCRIPT -->
  <script src="assets/js/main.js"></script>
</body>
</html>
